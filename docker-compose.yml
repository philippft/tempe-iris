services:
  tempe-iris-app:
    build: .
    container_name: tempe-iris-web
    restart: unless-stopped
    ports:
      - "8090:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}